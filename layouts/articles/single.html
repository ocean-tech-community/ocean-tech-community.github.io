{{ define "main" }}
<article class="single-page article-page">
  <div class="container">
    <p class="article-back"><a href="{{ .Parent.RelPermalink }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align: -0.2em; margin-right: 0.35em;"><path d="m12 19-7-7 7-7M5 12h14"/></svg>{{ i18n "articles.all" }}</a></p>
    <h1>{{ .Title }}</h1>
    <p class="article-meta article-byline"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format ":date_long" }}</time>{{ with .Params.author }} · {{ . }}{{ end }}</p>
    {{ with .Params.image }}
    <figure class="article-cover"><img src="{{ . | relURL }}" alt="{{ $.Params.imageAlt }}" decoding="async"></figure>
    {{ end }}
    <div class="page-content">{{ .Content }}</div>
    <p class="article-back"><a href="{{ .Parent.RelPermalink }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" style="vertical-align: -0.2em; margin-right: 0.35em;"><path d="m12 19-7-7 7-7M5 12h14"/></svg>{{ i18n "articles.all" }}</a></p>
  </div>
</article>
{{ end }}
