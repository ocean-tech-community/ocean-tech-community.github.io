<!-- Header -->
<header class="site-header">
  <div class="container nav">
    <div class="brand">
      <a href="{{ "/" | relURL }}" class="logo">
        <img src="/images/logo.png" alt="Ocean Tech" height="50">
      </a>
    </div>
    <nav class="nav-links">
      {{ range site.Menus.main }}
        <a class="{{ .Params.class | default "nav-link" }}" href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
