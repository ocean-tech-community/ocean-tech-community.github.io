faq:
  alone:
    question: Puis-je venir seul·e ?
    answer: Oui, bien sûr. La plupart des personnes viennent justement pour rencontrer du monde. Les apéros sont pensés pour permettre des échanges informels, même si tu ne connais encore personne.
  level:
    question: Quel niveau faut-il ?
    answer: Il n’y a aucun prérequis. La communauté rassemble des profils techniques, produit, design, étudiants, freelances, salarié·es et personnes simplement curieuses. L’envie d’échanger suffit.
  propose:
    question: Puis-je proposer un sujet ?
    beforeLink: Oui. Les retours d’expérience, les découvertes, les échecs utiles et les sujets autour du logiciel, du produit, du design, de la data, de l’architecture ou de l’IA sont les bienvenus. Découvre
    link: comment devenir speaker
  free:
    question: Est-ce payant ?
    answer: La participation aux rendez-vous Ocean Tech est gratuite, mais l’inscription est obligatoire. Elle nous aide énormément à anticiper le nombre de personnes, l’accueil et l’organisation de chaque événement.
  partner:
    question: Mon entreprise peut-elle devenir partenaire, accueillir ou sponsoriser une soirée ?
    beforeLink: Oui. Une entreprise ou une organisation locale peut accueillir une soirée, soutenir le moment convivial, partager une expertise ou aider à faire connaître la communauté. Découvre les différentes possibilités sur la page
    link: Partenaires
