    formats:
      title: Nos rendez-vous
      text: "Chaque mois, on se retrouve autour d’un apéro au Bob’s Beer. Une fois par trimestre, le rendez-vous quitte le bar pour une soirée dans une entreprise locale : talks, partages de pratiques, ateliers et échanges."
      apero:
        imageAlt: Des membres de la communauté Ocean Tech réunis au Bob’s Beer à Anglet
        frequency: Chaque mois
        title: Les apéros
        text: Chaque mois, on se retrouve au Bob’s Beer, à Anglet, pour un apéro sans programme. Viens comme tu es, pour discuter de ce qui t’intéresse et rencontrer les gens du coin.
      talks:
        imageAlt: Une intervenante présente un talk lors d’une soirée Ocean Tech
        frequency: Chaque trimestre
        title: Les soirées talks
        text: Une fois par trimestre, une entreprise locale ouvre ses portes pour des talks, retours d’expérience, ateliers et discussions. Pizzas et boissons sont là pour continuer à échanger.
    proof:
      statLabel: "personnes déjà inscrites<br>dans la communauté"
      title: Un endroit pour se retrouver entre gens du logiciel.
      text: Pour rencontrer des gens de la tech et du produit, pas besoin de monter à Bordeaux ou de filer à Paris. On se retrouve ici, autour d’un verre ou d’un talk.
      note: Une communauté ouverte aux salarié·es, freelances, étudiant·es et curieux·ses du numérique.
    cta:
      title: Le prochain verre est peut-être le début d’une belle rencontre.
      text: Inscris-toi pour recevoir les prochaines dates et rejoindre Ocean Tech.
  section:
    problem:
      title: Chez nous, la tech est là… mais chacun·e dans son coin
      text: |
        Nous sommes nombreux à travailler dans la tech & le produit sur le BAB et ses alentours : freelances, salarié·es, en remote ou en présentiel.

        Mais dispersés, il est difficile de se rassembler. Il n’existe que très peu d’événements ou de rendez-vous réguliers pour se retrouver en dehors du travail et discuter entre pairs.

        C’est frustrant. Surtout quand on vit et travaille dans un endroit aussi agréable.
    solution:
      title: Ocean Tech, c’est la solution
      text: |
        Ocean Tech, c’est un rendez-vous mensuel pour les personnes de la tech & du produit sur la côte.
        Un moment simple et ouvert pour :
        
        * se rencontrer entre pros de la tech & du produit,
        * échanger sur nos pratiques, nos projets, nos galères,
        * apprendre via des talks, des retours d’expérience ou des discussions informelles,
        * développer un réseau local,
        * et surtout passer un bon moment et rencontrer de nouvelles personnes.

        La communauté compte **déjà plus de 250 personnes inscrites** et l’initiative a été **relayée dans la presse locale**.
      imageAlt: Article de presse paru dans le journal Placéco
    action:
      title: Tu travailles dans la tech ou le produit sur le BAB ?
      text: Alors **Ocean Tech est fait pour toi.**
      sublink: On se retrouve bientôt autour d’un verre, entre gens du logiciel 🍻
    cfp:
      title: Tu veux proposer un sujet ?
      text: |
        Ocean Tech, ce n’est pas que des meetups classiques.
        
        Des formats "conférences" sont aussi organisés : talks, retours d’expérience, discussions thématiques...
      sublink: (le lien est ouvert à toutes celles et ceux qui souhaitent partager)
community:
  title: La communauté Ocean Tech
  intro: Sur la côte basco-landaise, nous sommes nombreux·ses à travailler dans la tech, le produit et le design. Ocean Tech crée des occasions simples de se rencontrer, d’apprendre et de créer des liens.
  why:
    title: Pourquoi Ocean Tech ?
    text1: Les personnes de la communauté travaillent un peu partout sur le BAB et ses alentours, en présentiel ou à distance. Il n’est pas toujours facile de se rencontrer et d’échanger.
    text2: "Ocean Tech est né pour créer un rendez-vous local, ouvert et régulier : un espace où l’on peut parler de ses projets, poser ses questions, rencontrer des pairs et simplement passer un bon moment."
  meetings:
    title: Des rencontres qui comptent
    text: "Chaque mois, on se retrouve autour d’un apéro au Bob’s Beer. Une fois par trimestre, le rendez-vous quitte le bar pour une soirée dans une entreprise locale : talks, partages de pratiques, ateliers et échanges."
  gallery:
    label: Photos de rencontres Ocean Tech
    caption: Quelques moments partagés lors des soirées Ocean Tech.
    openDocorgaCommunity: Agrandir la photo de la communauté chez Docorga
    docorgaCommunityAlt: Les participant·es à une soirée Ocean Tech chez Docorga
    openDocorgaTalk: Agrandir la photo d’un talk chez Docorga
    docorgaTalkAlt: Un talk présenté lors d’une soirée Ocean Tech chez Docorga
    openWikicampersTalk: Agrandir la photo d’un talk chez Wikicampers
    wikicampersTalkAlt: Une intervenante présente un talk lors d’une soirée Ocean Tech chez Wikicampers
  audience:
    title: À qui s’adresse la communauté ?
    text1: Aux développeur·ses, designers, product managers, freelances, fondateur·ices, étudiant·es, personnes en reconversion et à toutes celles et ceux qui s’intéressent au numérique.
    text2: Il n’y a pas de niveau requis. L’envie d’échanger suffit.
  press:
    title: Dans la presse
    text: La naissance d’Ocean Tech et son ambition de rassembler les professionnel·les du numérique ont aussi été racontées dans la presse locale.
    open: Agrandir l’article de presse
    imageAlt: Article « Fédérer la communauté numérique du BAB » paru dans Éco & Entreprises
    caption: Article paru dans Éco & Entreprises.
